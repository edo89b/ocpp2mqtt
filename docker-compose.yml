services:
  ocpp2mqtt:
    build: .
    container_name: ocpp2mqtt
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      MQTT_HOST: "${MQTT_HOST}"
      MQTT_PORT: "${MQTT_PORT}"
      MQTT_USER: "${MQTT_USER}"
      MQTT_PASS: "${MQTT_PASS}"
      MQTT_PREFIX: "${MQTT_PREFIX}"
      OCPP_PORT: "${OCPP_PORT}"
    networks:
      macvlan01_dom_est:
        ipv4_address: "${OCPP_IPV4}"
        ipv6_address: "${OCPP_IPV6}"
      # Rete interna del broker: mosquitto si raggiunge via bridge, non via macvlan.
      # Essendo multi-homed va usato l'alias `mqtt-int`, che risolve SOLO 172.21.0.2
      # (vedi /opt/docker/mqtt/docker-compose.yml).
      mqtt_net:

networks:                 
  macvlan01_dom_est:
    external: true
  mqtt_net:
    external: true